name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/taskboard/go.mod
          cache-dependency-path: services/taskboard/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: services/taskboard/web/package-lock.json
      - run: make check
      - run: make alerting-test
      - run: make archive
      - uses: actions/upload-artifact@v4
        with:
          name: homework-01
          path: artifacts/homework-01.zip
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/taskboard/go.mod
          cache-dependency-path: services/taskboard/go.sum
      - run: make up
      - run: make integration
      - run: make migrate
      - if: always()
        run: docker compose -f services/taskboard/compose.yaml logs
      - if: always()
        run: make down

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/taskboard/go.mod
          cache-dependency-path: services/taskboard/go.sum
      - name: Install minikube and kubectl (verified checksums)
        run: |
          bash scripts/install_k8s_tools.sh
          bash scripts/install_helm.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - run: make k8s-start k8s-build k8s-deploy k8s-validate
      - run: make k8s-scale REPLICAS=3
      - name: CRUD through Kubernetes Service
        run: |
          bash scripts/k8s.sh forward > /tmp/forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/readyz; then break; fi
            echo "Waiting for readiness ($attempt/30)"
            sleep 1
          done
          TASKBOARD_URL=http://127.0.0.1:18080 make integration
      - name: Exact business counter semantics on one pod
        run: |
          kubectl --context tbank-sre-hw02 -n taskboard-lab port-forward deployment/taskboard 18081:8080 19090:9090 > /tmp/metrics-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19090/metrics > /dev/null; then break; fi
            echo "Waiting for metrics ($attempt/30)"
            sleep 1
          done
          TASKBOARD_URL=http://127.0.0.1:18081 TASKBOARD_METRICS_URL=http://127.0.0.1:19090 make integration
      - name: Install VictoriaMetrics via Helm
        run: make monitoring-install
      - name: Check TSDB and dynamic discovery
        run: |
          bash scripts/monitoring.sh forward > /tmp/vm-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" || true' EXIT
          make monitoring-check
          make k8s-scale REPLICAS=4
          python3 scripts/check_monitoring.py --replicas 4
          make k8s-scale REPLICAS=3
          make monitoring-check
          make monitoring-render
      - name: Install VictoriaLogs and Vector
        run: make logging-install logging-validate logging-render
      - name: Check JSON stdout delivery and LogsQL
        run: |
          bash scripts/logging.sh forward > /tmp/vl-forward.log 2>&1 &
          vl_pid=$!
          kubectl --context tbank-sre-hw02 -n taskboard-lab port-forward service/taskboard 18080:8080 > /tmp/log-app-forward.log 2>&1 &
          app_pid=$!
          trap 'kill "$vl_pid" "$app_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            echo "Waiting for log test app ($attempt/30)"
            sleep 1
          done
          make logging-check
          kubectl --context tbank-sre-hw02 -n taskboard-lab logs -l app=taskboard --tail=5 > /tmp/app-stdout.jsonl
          python3 -c 'import json; rows=[json.loads(line) for line in open("/tmp/app-stdout.jsonl") if line.strip()]; assert rows and all(all(k in r for k in ("timestamp","level","message","service.name")) for r in rows)'
      - name: Install SLO prober and generate real traffic
        run: make slo-install slo-validate slo-render slo-load-start
      - name: Check SLI degradation and recovery
        run: |
          bash scripts/monitoring.sh forward > /tmp/slo-forward.log 2>&1 &
          forward_pid=$!
          trap 'make slo-mode MODE=healthy; make slo-load-stop; kill "$forward_pid" || true' EXIT
          python3 scripts/check_slo.py --phase healthy --timeout 150
          python3 scripts/check_slo.py --monthly
          make slo-mode MODE=slow
          python3 scripts/check_slo.py --phase slow
          make slo-mode MODE=errors
          python3 scripts/check_slo.py --phase errors
          make slo-mode MODE=healthy
          python3 scripts/check_slo.py --phase recovery --timeout 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homework-05-verification
          path: artifacts/hw05/
      - name: Install and validate vmalert and Alertmanager
        run: make alerting-install alerting-validate alerting-render
      - name: Verify real alert firing, webhook delivery and recovery
        run: |
          bash scripts/alerting.sh forward > /tmp/alerting-forward.log 2>&1 &
          alerting_pid=$!
          bash scripts/monitoring.sh forward > /tmp/alerting-vm-forward.log 2>&1 &
          vm_pid=$!
          trap 'kill "$alerting_pid" "$vm_pid" || true' EXIT
          make alerting-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homework-06-verification
          path: artifacts/hw06/

      - name: Install Grafana and validate manifests
        run: make grafana-install grafana-validate grafana-render
      - name: Import PostgreSQL dashboard and check real Grafana queries
        run: |
          bash scripts/grafana.sh forward > /tmp/grafana-forward.log 2>&1 &
          forward_pid=$!
          trap 'make slo-load-stop; kill "$forward_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          make slo-load-start
          sleep 25
          make grafana-import-postgres grafana-check grafana-export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homework-07-verification
          path: artifacts/hw07/
      - if: always()
        run: |
          kubectl --context tbank-sre-hw02 -n taskboard-lab get pods,svc,pvc,job
          kubectl --context tbank-sre-hw02 -n taskboard-lab get events --sort-by=.lastTimestamp
          kubectl --context tbank-sre-hw02 -n monitoring get pods,svc,pvc
          kubectl --context tbank-sre-hw02 -n monitoring logs statefulset/vm-single --tail=30
          kubectl --context tbank-sre-hw02 -n monitoring logs deployment/vmalert --tail=30
          kubectl --context tbank-sre-hw02 -n monitoring logs deployment/alertmanager --tail=30
          kubectl --context tbank-sre-hw02 -n logging get pods,daemonset,svc,pvc
          kubectl --context tbank-sre-hw02 -n logging logs daemonset/vector-taskboard --tail=30
      - if: always()
        run: minikube delete -p tbank-sre-hw02
