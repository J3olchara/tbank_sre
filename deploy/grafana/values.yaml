# grafana-community/grafana 14.4.0 / Grafana 13.3.0.
fullnameOverride: grafana
replicas: 1
deploymentStrategy:
  type: Recreate
rbac:
  create: false
automountServiceAccountToken: false
serviceAccount:
  automountServiceAccountToken: false
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
persistence:
  enabled: true
  size: 1Gi
initChownData:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
service:
  type: ClusterIP
testFramework:
  enabled: false
env:
  GF_ANALYTICS_REPORTING_ENABLED: "false"
  GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
  GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
  GF_USERS_ALLOW_SIGN_UP: "false"
  GF_AUTH_ANONYMOUS_ENABLED: "false"
  GF_LOG_MODE: console
  GF_LOG_CONSOLE_FORMAT: json
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://vm-single.monitoring.svc.cluster.local:8428
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 5s
          prometheusType: Prometheus
          prometheusVersion: 2.24.0
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: taskboard
        orgId: 1
        folder: SRE
        folderUid: sre
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards/taskboard
dashboardsConfigMaps:
  taskboard: grafana-taskboard-dashboard
