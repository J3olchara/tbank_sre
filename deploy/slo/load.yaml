apiVersion: batch/v1
kind: Job
metadata:
  name: taskboard-slo-load
  namespace: taskboard-lab
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: taskboard-slo-load
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic
          image: tbank-sre-taskboard:hw02
          imagePullPolicy: Never
          command: [/srv/taskboard-load]
          env:
            - name: LOAD_TARGET
              value: http://taskboard:8080
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
