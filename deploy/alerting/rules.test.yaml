  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardProbeFailed
    exp_alerts:
    - exp_labels:
        namespace: taskboard-lab
        service: taskboard
        component: prober
        severity: critical
      exp_annotations:
        summary: UI and task API probe is unavailable
        description: The UI/API check is unsuccessful, its exporter is missing or its result is older
          than 12s, for 20s.
  - eval_time: 1m
    groupname: taskboard-runtime
    alertname: TaskboardGoroutinesHigh
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-runtime
    alertname: TaskboardGoHeapHigh
    exp_alerts: []
- name: missing prober must page
