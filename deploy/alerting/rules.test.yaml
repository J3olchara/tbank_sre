# Rule behavior is tested with the real MetricsQL engine (vmalert-tool).
rule_files:
- rules.yaml
evaluation_interval: 5s
tests:
- name: 'no traffic and fresh prober: no request alerts'
  interval: 5s
  input_series:
  - series: taskboard_probe_success{job="taskboard-prober",namespace="taskboard-lab"}
    values: 1x36
  - series: up{job="taskboard-prober",namespace="taskboard-lab"}
    values: 1x36
  - series: taskboard_probe_last_run_timestamp_seconds{job="taskboard-prober",namespace="taskboard-lab"}
    values: 946684800+5x36
  alert_rule_test:
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardHighErrorRate
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardHighLatency
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardProbeFailed
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-runtime
    alertname: TaskboardGoroutinesHigh
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-runtime
    alertname: TaskboardGoHeapHigh
    exp_alerts: []
- name: error rate pending then firing
  interval: 5s
  input_series:
  - series: taskboard_probe_success{job="taskboard-prober",namespace="taskboard-lab"}
    values: 1x36
  - series: up{job="taskboard-prober",namespace="taskboard-lab"}
    values: 1x36
  - series: taskboard_probe_last_run_timestamp_seconds{job="taskboard-prober",namespace="taskboard-lab"}
    values: 946684800+5x36
  - series: taskboard_http_requests_total{job="taskboard",namespace="taskboard-lab",route="GET /api/tasks",code="200"}
    values: 0+9x36
  - series: taskboard_http_requests_total{job="taskboard",namespace="taskboard-lab",route="GET /api/tasks",code="503"}
    values: 0+1x36
  alert_rule_test:
  - eval_time: 20s
    groupname: taskboard-service
    alertname: TaskboardHighErrorRate
    exp_alerts: []
  - eval_time: 20s
    groupname: taskboard-service
    alertname: TaskboardHighLatency
    exp_alerts: []
  - eval_time: 20s
    groupname: taskboard-service
    alertname: TaskboardProbeFailed
    exp_alerts: []
  - eval_time: 20s
    groupname: taskboard-runtime
    alertname: TaskboardGoroutinesHigh
    exp_alerts: []
  - eval_time: 20s
    groupname: taskboard-runtime
    alertname: TaskboardGoHeapHigh
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardHighErrorRate
    exp_alerts:
    - exp_labels:
        namespace: taskboard-lab
        service: taskboard
        component: api
        severity: critical
      exp_annotations:
        summary: API 5xx rate exceeds 5%
        description: More than 5% of task API responses are 5xx for 30s; window 1m, at least 10 requests.
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardHighLatency
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardProbeFailed
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-runtime
    alertname: TaskboardGoroutinesHigh
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-runtime
    alertname: TaskboardGoHeapHigh
    exp_alerts: []
- name: slow successful requests
  interval: 5s
  input_series:
  - series: taskboard_probe_success{job="taskboard-prober",namespace="taskboard-lab"}
    values: 1x36
  - series: up{job="taskboard-prober",namespace="taskboard-lab"}
    values: 1x36
  - series: taskboard_probe_last_run_timestamp_seconds{job="taskboard-prober",namespace="taskboard-lab"}
    values: 946684800+5x36
  - series: taskboard_http_request_duration_seconds_bucket{job="taskboard",namespace="taskboard-lab",route="GET
      /api/tasks",le="0.25"}
    values: 0+8x36
  - series: taskboard_http_request_duration_seconds_count{job="taskboard",namespace="taskboard-lab",route="GET
      /api/tasks"}
    values: 0+10x36
  alert_rule_test:
  - eval_time: 20s
    groupname: taskboard-service
    alertname: TaskboardHighErrorRate
    exp_alerts: []
  - eval_time: 20s
    groupname: taskboard-service
    alertname: TaskboardHighLatency
    exp_alerts: []
  - eval_time: 20s
    groupname: taskboard-service
    alertname: TaskboardProbeFailed
    exp_alerts: []
  - eval_time: 20s
    groupname: taskboard-runtime
    alertname: TaskboardGoroutinesHigh
    exp_alerts: []
  - eval_time: 20s
    groupname: taskboard-runtime
    alertname: TaskboardGoHeapHigh
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardHighErrorRate
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardHighLatency
    exp_alerts:
    - exp_labels:
        namespace: taskboard-lab
        service: taskboard
        component: api
        severity: warning
      exp_annotations:
        summary: More than 10% of API responses exceed 250ms
        description: Fewer than 90% of task API responses finish within 250ms for 30s; window 1m, at least
          10 requests.
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardProbeFailed
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-runtime
    alertname: TaskboardGoroutinesHigh
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-runtime
    alertname: TaskboardGoHeapHigh
    exp_alerts: []
- name: low traffic does not page
