  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardHighErrorRate
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardHighLatency
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardProbeFailed
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-runtime
    alertname: TaskboardGoroutinesHigh
    exp_alerts:
    - exp_labels:
        namespace: taskboard-lab
        service: taskboard
        component: go
        severity: warning
        job: taskboard
        pod: a
      exp_annotations:
        summary: Go goroutines exceed 200
        description: Goroutine count stays above 200 for 30s; investigate blocked requests or goroutine
          leaks.
  - eval_time: 1m
    groupname: taskboard-runtime
    alertname: TaskboardGoHeapHigh
    exp_alerts:
    - exp_labels:
        namespace: taskboard-lab
        service: taskboard
        component: go
        severity: warning
        job: taskboard
        pod: a
      exp_annotations:
        summary: Live Go heap exceeds 32 MiB
        description: Live Go heap stays above 32 MiB for 30s; lab container memory limit is 128 MiB.
  - eval_time: 2m
    groupname: taskboard-service
    alertname: TaskboardHighErrorRate
    exp_alerts: []
  - eval_time: 2m
    groupname: taskboard-service
    alertname: TaskboardHighLatency
    exp_alerts: []
  - eval_time: 2m
    groupname: taskboard-service
    alertname: TaskboardProbeFailed
    exp_alerts: []
  - eval_time: 2m
    groupname: taskboard-runtime
    alertname: TaskboardGoroutinesHigh
    exp_alerts: []
  - eval_time: 2m
    groupname: taskboard-runtime
    alertname: TaskboardGoHeapHigh
    exp_alerts: []
