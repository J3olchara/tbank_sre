    values: 946684800+5x36
  - series: go_goroutines{job="taskboard",namespace="taskboard-lab",pod="a"}
    values: 301x18 10x18
  - series: go_memstats_heap_alloc_bytes{job="taskboard",namespace="taskboard-lab",pod="a"}
    values: 50331648x18 2097152x18
  alert_rule_test:
  - eval_time: 20s
    groupname: taskboard-service
    alertname: TaskboardHighErrorRate
    exp_alerts: []
  - eval_time: 20s
    groupname: taskboard-service
    alertname: TaskboardHighLatency
