    values: 0+0.1x36
  alert_rule_test:
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardHighErrorRate
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardHighLatency
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardProbeFailed
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-runtime
    alertname: TaskboardGoroutinesHigh
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-runtime
    alertname: TaskboardGoHeapHigh
    exp_alerts: []
- name: counter reset on one replica does not invent 5xx
  interval: 5s
  input_series:
  - series: taskboard_probe_success{job="taskboard-prober",namespace="taskboard-lab"}
    values: 1x36
  - series: up{job="taskboard-prober",namespace="taskboard-lab"}
    values: 1x36
  - series: taskboard_probe_last_run_timestamp_seconds{job="taskboard-prober",namespace="taskboard-lab"}
    values: 946684800+5x36
  - series: taskboard_http_requests_total{job="taskboard",namespace="taskboard-lab",route="GET /api/tasks",code="200",pod="a"}
    values: 100+10x5 0+10x30
  - series: taskboard_http_requests_total{job="taskboard",namespace="taskboard-lab",route="GET /api/tasks",code="200",pod="b"}
    values: 100+10x36
  - series: taskboard_http_requests_total{job="taskboard",namespace="taskboard-lab",route="GET /api/tasks",code="503",pod="a"}
    values: 1x5 0x30
  alert_rule_test:
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardHighErrorRate
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardHighLatency
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-service
    alertname: TaskboardProbeFailed
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-runtime
    alertname: TaskboardGoroutinesHigh
    exp_alerts: []
  - eval_time: 1m
    groupname: taskboard-runtime
    alertname: TaskboardGoHeapHigh
    exp_alerts: []
- name: 'failed prober: pending then firing'
  interval: 5s
  input_series:
  - series: taskboard_probe_success{job="taskboard-prober",namespace="taskboard-lab"}
    values: '0x36'
  - series: up{job="taskboard-prober",namespace="taskboard-lab"}
    values: 1x36
  - series: taskboard_probe_last_run_timestamp_seconds{job="taskboard-prober",namespace="taskboard-lab"}
    values: 946684800+5x36
  alert_rule_test:
  - eval_time: 15s
    groupname: taskboard-service
    alertname: TaskboardHighErrorRate
    exp_alerts: []
  - eval_time: 15s
    groupname: taskboard-service
    alertname: TaskboardHighLatency
    exp_alerts: []
  - eval_time: 15s
