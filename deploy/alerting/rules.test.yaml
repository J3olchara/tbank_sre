  - series: up{job="taskboard-prober",namespace="taskboard-lab"}
    values: 1x36
  - series: taskboard_probe_last_run_timestamp_seconds{job="taskboard-prober",namespace="taskboard-lab"}
    values: 946684800+5x36
  - series: taskboard_http_requests_total{job="taskboard",namespace="taskboard-lab",route="GET /api/tasks",code="503"}
    values: 0+0.1x36
  - series: taskboard_http_request_duration_seconds_bucket{job="taskboard",namespace="taskboard-lab",route="GET
      /api/tasks",le="0.25"}
    values: '0x36'
  - series: taskboard_http_request_duration_seconds_count{job="taskboard",namespace="taskboard-lab",route="GET
