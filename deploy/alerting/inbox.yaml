apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alert-inbox-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alert-inbox
  namespace: monitoring
spec:
  selector:
    app: taskboard-alert-inbox
  ports:
    - name: http
      port: 8085
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-inbox
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: taskboard-alert-inbox
  template:
    metadata:
      labels:
        app: taskboard-alert-inbox
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inbox
          image: tbank-sre-taskboard:hw02
          imagePullPolicy: Never
          command: [/srv/taskboard-alert-inbox]
          env:
            - name: INBOX_ADDR
              value: :8085
            - name: INBOX_DATA
              value: /data/notifications.json
          ports:
            - name: http
              containerPort: 8085
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: alert-inbox-data
