apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector-taskboard
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: taskboard-log-reader
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: taskboard-log-reader
subjects:
  - kind: ServiceAccount
    name: vector-taskboard
    namespace: logging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: taskboard-log-reader
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-taskboard
  namespace: logging
spec:
  selector:
    matchLabels:
      app: vector-taskboard
  template:
    metadata:
      labels:
        app: vector-taskboard
    spec:
      serviceAccountName: vector-taskboard
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vector
          image: timberio/vector:0.61.0-alpine
          imagePullPolicy: IfNotPresent
          args: [--config, /etc/vector/vector.yaml]
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            # Docker CRI log files can be symlinks into this directory.
            - name: docker-logs
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
      volumes:
        - name: config
          configMap:
            name: vector-taskboard
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: docker-logs
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: /var/lib/vector-taskboard
            type: DirectoryOrCreate
